<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07090c">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 40 40%22%3E%3Cpath d=%22M20 2l15.6 9v18L20 38 4.4 29V11z%22 fill=%22%2307090c%22 stroke=%22%23d4b26a%22 stroke-width=%222%22/%3E%3C/svg%3E">
  <title>Stealth Leviathan · Private Whale Syndicate</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <!--
    Stealth Leviathan · Dashboard shell
    ├── data/db.json          → all demo data (projects, positions, order books, treasury …)
    ├── js/utils.js           → formatting, dates, DOM helpers
    ├── js/engine.js          → pure business logic (vesting, KPIs, penalty, slippage, matching)
    ├── js/auth.js            → members-only login gate (credentials in db.json → auth)
    ├── js/store.js           → state + actions (reducers) + localStorage session
    ├── js/charts.js          → dependency-free SVG charts
    ├── js/components.js      → modal / toast / KPI card / badges
    ├── js/views/*.js         → overview · portfolio · deals · otc · analytics
    └── js/app.js             → shell, router, cross-view flows, settings
  -->
  <div class="app">
    <aside id="sidebar" class="sidebar"></aside>
    <div class="main">
      <header id="topbar" class="topbar"></header>
      <main id="view" class="view" tabindex="-1">
        <div class="boot"><span class="spinner"></span><span class="muted">Decrypting syndicate ledger…</span></div>
      </main>
    </div>
    <nav id="tabbar" class="tabbar" aria-label="Primary"></nav>
  </div>
  <div id="login"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script src="js/utils.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/store.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/components.js"></script>
  <script src="js/views/overview.js"></script>
  <script src="js/views/portfolio.js"></script>
  <script src="js/views/deals.js"></script>
  <script src="js/views/otc.js"></script>
  <script src="js/views/analytics.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
